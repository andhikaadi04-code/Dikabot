<div class="music-player apple-spotify-theme">
  <!-- Subtle blurred album ambient background -->
  <div class="player-backdrop">
    {{BACKDROP}}
  </div>
  <div class="player-scrim"></div>

  <main class="player-content">
    <!-- Top indicator pill & mode toggle -->
    <div class="player-top-bar">
      <div class="player-pill-notch"></div>
      <button class="player-lyrics-toggle" id="player-lyrics-toggle" title="Toggle Lyrics" aria-label="Lirik">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          <line x1="9" y1="9" x2="15" y2="9"></line>
          <line x1="9" y1="13" x2="13" y2="13"></line>
        </svg>
      </button>
    </div>

    <!-- Artwork Section (Apple Lockscreen Style) -->
    <div class="player-artwork-card" id="player-artwork-card">
      {{COVER}}
    </div>

    <!-- Synchronized Lyrics View (Toggleable) -->
    <section class="player-lyrics" id="player-lyrics" style="display: none;"></section>

    <!-- Track Info & Equalizer Wave Row -->
    <div class="player-meta-row">
      <div class="player-track-info">
        <div class="player-title" title="{{TITLE}}">{{TITLE}}</div>
        <div class="player-artist" title="{{ARTIST}}">{{ARTIST}}</div>
      </div>
      <div class="player-equalizer" id="player-equalizer" title="Audio Wave">
        <span class="eq-bar bar-1"></span>
        <span class="eq-bar bar-2"></span>
        <span class="eq-bar bar-3"></span>
        <span class="eq-bar bar-4"></span>
      </div>
    </div>

    <!-- iOS Transport (Progress Bar & Times) -->
    <div class="player-transport">
      <div class="player-progress" id="player-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100">
        <div class="player-progress-fill" id="player-progress-fill"></div>
        <div class="player-progress-thumb" id="player-progress-thumb"></div>
      </div>

      <div class="player-times">
        <span id="player-current-time">0:00</span>
        <span id="player-remaining-time">-{{DURATION}}</span>
      </div>
    </div>

    <!-- Playback Controls (Rewind, Play/Pause, Forward) -->
    <div class="player-controls">
      <!-- Rewind 15s / Prev -->
      <button class="player-control-btn" id="player-rewind" aria-label="Mundur 15 detik" title="Mundur 15 detik">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M11 5L1 12l10 7V5zm12 0l-10 7 10 7V5z"/>
        </svg>
      </button>

      <!-- Main Play / Pause Button -->
      <button class="player-control-btn player-btn-play" id="player-play" aria-label="Play / Pause" title="Play / Pause">
        <svg class="icon-play" id="player-play-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M6 4.5v15c0 .85.93 1.38 1.66.94l12-7.5c.71-.44.71-1.45 0-1.89l-12-7.5C6.93 3.12 6 3.65 6 4.5z"/>
        </svg>
        <svg class="icon-pause" id="player-pause-icon" viewBox="0 0 24 24" fill="currentColor" style="display:none">
          <rect x="5.5" y="4" width="4.5" height="16" rx="2.25"/>
          <rect x="14" y="4" width="4.5" height="16" rx="2.25"/>
        </svg>
      </button>

      <!-- Fast-forward 15s / Next -->
      <button class="player-control-btn" id="player-forward" aria-label="Maju 15 detik" title="Maju 15 detik">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M1 19l10-7L1 5v14zm12 0l10-7-10-7v14z"/>
        </svg>
      </button>
    </div>

    <!-- Volume Row (iOS Lockscreen Style) -->
    <div class="player-volume-row">
      <!-- Speaker Low Icon -->
      <svg class="vol-icon" viewBox="0 0 24 24" fill="currentColor">
        <path d="M11 5L6 9H2v6h4l5 4V5z"/>
      </svg>

      <!-- Interactive Volume Slider -->
      <div class="player-volume-slider" id="player-volume-slider">
        <div class="player-volume-fill" id="player-volume-fill" style="width: 80%;"></div>
      </div>

      <!-- Speaker High Icon -->
      <svg class="vol-icon" viewBox="0 0 24 24" fill="currentColor">
        <path d="M14 8.83v6.34A4.004 4.004 0 0017 12a4.004 4.004 0 00-3-3.17zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77zM11 5L6 9H2v6h4l5 4V5z"/>
      </svg>
    </div>

    <!-- Device Pill (AirPlay Style: DikaDev) -->
    <div class="player-device-container">
      <div class="player-device-pill" id="player-device-pill" title="Output Audio: DikaDev">
        <!-- Apple AirPlay Audio Icon -->
        <svg class="airplay-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 17a7 7 0 0 1 14 0"/>
          <path d="M8.5 17a3.5 3.5 0 0 1 7 0"/>
          <circle cx="12" cy="17" r="1.5" fill="currentColor"/>
        </svg>
        <span class="device-name">DikaDev</span>
      </div>
    </div>
  </main>
</div>

<audio id="player-audio" preload="metadata"></audio>
